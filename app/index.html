<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><meta name='apple-mobile-web-app-capable' content='yes'><title>Delish — pick your meal</title><style>
:root { --ink:#2b2117; --paper:#faf6ef; --card:#ffffff; --accent:#c2410c;
        --good:#15803d; --muted:#8a7f72; }
* { box-sizing:border-box; margin:0; }
body { font-family:-apple-system, 'Avenir Next', 'Segoe UI', sans-serif;
       background:var(--paper); color:var(--ink); padding:24px;
       max-width:1100px; margin:0 auto; }
h1 { font-size:clamp(26px,4vw,40px); letter-spacing:-.02em; }
.sub { color:var(--muted); margin:6px 0 26px; font-size:16px; }
.grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(290px,1fr)); gap:22px; }
.card { background:var(--card); border-radius:18px; overflow:hidden;
        box-shadow:0 2px 6px rgba(43,33,23,.08), 0 12px 28px rgba(43,33,23,.07); }
.card img { width:100%; height:215px; object-fit:cover; display:block; }
.pad { padding:16px 18px 18px; }
.num { display:inline-block; background:var(--accent); color:#fff; font-weight:700;
       border-radius:999px; padding:2px 12px; font-size:14px; margin-bottom:8px; }
.card h2 { font-size:21px; letter-spacing:-.01em; }
.tagline { color:var(--muted); font-size:14.5px; margin:5px 0 12px; line-height:1.45; }
.badges { display:flex; flex-wrap:wrap; gap:8px; }
.badge { font-size:13px; font-weight:600; padding:4px 10px; border-radius:8px;
         background:#f3ede2; }
.badge.protein { background:#dcfce7; color:var(--good); }
.fulfill { margin-top:13px; padding-top:12px; border-top:1px dashed #e4dccb;
           font-size:13.5px; color:var(--muted); line-height:1.6; }
.section { background:var(--card); border-radius:18px; padding:22px 24px; margin-bottom:20px;
           box-shadow:0 2px 6px rgba(43,33,23,.08); }
.section h2 { font-size:18px; margin-bottom:4px; }
.section .hint { color:var(--muted); font-size:13.5px; margin-bottom:12px; }
ul.shop { list-style:none; } ul.shop li { padding:7px 0; border-bottom:1px solid #f1ebdf;
          font-size:15.5px; display:flex; gap:10px; align-items:baseline; }
ul.shop li:last-child { border-bottom:none; }
.qty { color:var(--muted); font-size:13.5px; margin-left:auto; white-space:nowrap; }
ol.steps { padding-left:22px; } ol.steps li { padding:6px 0; font-size:15.5px; line-height:1.5; }
.hero { display:flex; gap:22px; align-items:center; margin-bottom:22px; flex-wrap:wrap; }
.hero img { width:340px; max-width:100%; border-radius:18px; height:230px; object-fit:cover; }
.cb { width:17px; height:17px; flex:none; position:relative; top:2px; }
.footer { color:var(--muted); font-size:13px; margin-top:26px; text-align:center; }
/* mobile shopping checklist */
.storebar { position:sticky; top:0; z-index:5; background:var(--paper); padding:10px 0 12px;
            border-bottom:1px solid #e8e0d0; margin-bottom:16px; }
.storebar h1 { font-size:22px; }
.storebar .meta { color:var(--muted); font-size:13.5px; margin-top:3px; }
.progress { font-weight:700; color:var(--accent); font-size:15px; margin-top:6px; }
.stop-h { font-size:13px; font-weight:800; text-transform:uppercase; letter-spacing:.08em;
          color:var(--accent); margin:22px 4px 10px; }
.stop-h small { color:var(--muted); font-weight:600; text-transform:none; letter-spacing:0; }
.item { display:flex; gap:14px; align-items:center; background:var(--card); border-radius:16px;
        padding:12px 14px; margin-bottom:10px; cursor:pointer; user-select:none;
        box-shadow:0 1px 4px rgba(43,33,23,.08); transition:opacity .15s; }
.item img { width:74px; height:74px; object-fit:contain; border-radius:10px; background:#fff;
            flex:none; border:1px solid #f0e9db; }
.item .info { flex:1; min-width:0; }
.item .title { font-weight:700; font-size:15.5px; line-height:1.3; }
.item .spot { color:var(--muted); font-size:13px; margin-top:3px; }
.item .qty2 { display:inline-block; background:#f3ede2; border-radius:6px; padding:1px 8px;
              font-size:12.5px; font-weight:700; margin-top:5px; }
.item .box { width:30px; height:30px; border:2.5px solid #d4c8b2; border-radius:9px; flex:none;
             display:flex; align-items:center; justify-content:center; font-size:19px;
             color:transparent; transition:all .15s; }
.item.done { opacity:.45; }
.item.done .title { text-decoration:line-through; }
.item.done .box { background:var(--good); border-color:var(--good); color:#fff; }

.appbar { position:sticky; top:0; z-index:5; background:var(--paper); padding:14px 0 10px;
          border-bottom:1px solid #e8e0d0; margin-bottom:14px; }
.appbar h1 { font-size:24px; }
.appbar .sub { margin:4px 0 10px; font-size:14px; }
.chips { display:flex; gap:8px; overflow-x:auto; padding-bottom:4px;
         -webkit-overflow-scrolling:touch; scrollbar-width:none; }
.chips::-webkit-scrollbar { display:none; }
.chip { flex:none; font-size:13.5px; font-weight:700; padding:7px 14px; border-radius:999px;
        background:#f3ede2; color:var(--ink); border:1.5px solid transparent; cursor:pointer;
        user-select:none; }
.chip.on { background:var(--accent); color:#fff; }
.reroll { display:block; width:100%; margin:18px 0 6px; padding:15px; border:none;
          border-radius:14px; background:var(--accent); color:#fff; font-size:16.5px;
          font-weight:800; cursor:pointer; font-family:inherit;
          box-shadow:0 4px 14px rgba(194,65,12,.3); }
.reroll:active { transform:scale(.98); }
.empty { text-align:center; color:var(--muted); padding:40px 10px; font-size:15px; }
.card { cursor:pointer; }
.back { display:inline-block; margin-bottom:10px; color:var(--accent); font-weight:700;
        text-decoration:none; font-size:15px; }
.count { color:var(--muted); font-size:13px; text-align:center; margin-top:8px; }
.modes { display:flex; gap:8px; margin:12px 0 4px; }
.mode { flex:1; text-align:center; font-size:13px; font-weight:700; padding:9px 6px;
        border-radius:12px; background:#f3ede2; border:1.5px solid transparent;
        cursor:pointer; user-select:none; line-height:1.25; }
.mode.on { background:var(--accent); color:#fff; }
.fresh { font-size:12.5px; color:var(--muted); background:#f3ede2; border-radius:10px;
         padding:9px 12px; margin:10px 0 14px; line-height:1.5; }
.fresh.stale { background:#fef3c7; color:#92400e; }
.item.missing { border:1.5px dashed #f59e0b; background:#fffbeb; }
.item.missing .spot { color:#92400e; }
.dcta { background:#eef6ee; border-radius:14px; padding:14px 16px; font-size:14.5px;
        line-height:1.55; margin:12px 0 16px; }

  const sorted = [...p].sort((a, b) => rank(a) - rank(b));
  const picked = [], perTag = {};
  for (const m of sorted) {            // diversity: max 2 of a primary tag
    const t = m.tags[0];
    if ((perTag[t] || 0) >= 2) continue;
    picked.push(m); perTag[t] = (perTag[t] || 0) + 1;
    if (picked.length === 4) break;
  }
  for (const m of sorted) {            // backfill if diversity left us short
    if (picked.length === 4) break;
    if (!picked.includes(m)) picked.push(m);
  }
  deal = picked.map(m => m.id);
  let r = rec.filter(id => !deal.includes(id)).concat(deal);
  if (r.length >= Math.max(p.length, REC_MAX)) r = [...deal]; // pool exhausted: reset memory
  localStorage.setItem(REC_KEY, JSON.stringify(r.slice(-REC_MAX)));
  renderList();
}

function mealCard(m, i) {
  const pans = m.pans === 0 ? 'Zero pans' : '1 pan';
  return `<div class='card' onclick="location.hash='m/${m.id}'">
    <img src='assets/${m.id}.jpg' loading='lazy' alt='${esc(m.name)}'>
    <div class='pad'><span class='num'>Option ${i + 1}</span>
      <h2>${esc(m.name)}</h2><p class='tagline'>${esc(m.tagline)}</p>
      <div class='badges'><span class='badge protein'>${m.protein_g}g protein</span>
        <span class='badge'>${m.active_minutes} min effort</span>
        <span class='badge'>${pans}</span><span class='badge'>~${m.calories} cal</span></div>
    </div></div>`;
}

function renderList() {
  const byId = Object.fromEntries(MEALS.map(m => [m.id, m]));
  const ms = deal.map(id => byId[id]).filter(Boolean);
  const chips = ALL_TAGS.map(t =>
    `<span class='chip ${tags.has(t) ? 'on' : ''}' onclick='toggleTag("${t}")'>${t}</span>`).join('');
  $('#root').innerHTML = `
    <div class='appbar'><h1>You're hungry. Pick one. 🔥</h1>
      <p class='sub'>High-protein, ≤15 min effort, one store per meal.</p>
      <div class='chips'>${chips}</div></div>
    ${ms.length ? `<div class='grid'>${ms.map(mealCard).join('')}</div>` : ''}
    ${!ms.length ? `<div class='empty'>No meals match those filters — tap some off.</div>` : ''}
    <button class='reroll' onclick='newDeal()'>↻ None of these — show me different options</button>
    <div class='count'>${pool().length} meals in the library · dealt 4, fresh ones first</div>`;
  window.scrollTo(0, 0);
}

function toggleTag(t) {
  tags.has(t) ? tags.delete(t) : tags.add(t);
  newDeal();
}

function getMode() {
  const m = localStorage.getItem(MODE_KEY);
  return ['wf', 'smiths', 'delivery'].includes(m) ? m : 'wf';
}
function setMode(m, id) {
  localStorage.setItem(MODE_KEY, m);
  renderPlan(id);
}

function itemCard(dataKey, title, spot, qty, img, saved, missing) {
  const imgTag = img
    ? `<img src='${img}' loading='lazy' alt='' onerror='this.style.display="none"'>` : '';
  return `<div class='item ${saved.has(dataKey) ? 'done' : ''} ${missing ? 'missing' : ''}' data-key='${esc(dataKey)}'>
    ${imgTag}<div class='info'><div class='title'>${esc(title)}</div>
    <div class='spot'>📍 ${esc(spot)}</div>
    <span class='qty2'>${esc(qty)}</span></div>
    <div class='box'>${saved.has(dataKey) ? '✓' : ''}</div></div>`;
}

// Whole Foods: department-level walk order (WF publishes no aisle data).
function wfSections(m, saved) {
  const byDept = {};
  m.ingredients.forEach(i => (byDept[i.dept] = byDept[i.dept] || []).push(i));
  let stop = 0, out = '';
  for (const [key, label, hint] of WALK) {
    const items = byDept[key];
    if (!items) continue;
    stop++;
    out += `<div class='stop-h'>Stop ${stop} · ${esc(label)} <small>— ${esc(hint)}</small></div>`;
    for (const ing of items) {
      const p = ing.product || {};
      out += itemCard(ing.item, p.title || ing.item, p.spot || hint, ing.qty, p.image, saved);
    }
  }
  return out;
}

// Smiths: exact aisle/side/bay, sorted in walk order (produce first,
// numbered aisles ascending, frozen second-to-last, deli/hot LAST).
function smithsArea(rec) {
  const a = (rec && rec.aisle) || '';
  if (/produce/i.test(a)) return [0, 'Produce'];
  const n = a.match(/^aisle\s*(\d+)/i);
  if (n) return [10 + +n[1], a];
  if (/meat|seafood/i.test(a)) return [100, 'Meat & Seafood'];
  if (/bakery/i.test(a)) return [110, 'Bakery'];
  if (/dairy/i.test(a)) return [120, 'Dairy'];
  if (/frozen/i.test(a)) return [200, 'Frozen — keep it cold'];
  if (/deli/i.test(a)) return [300, 'Deli / hot case — grab LAST'];
  return [150, a || 'Not yet mapped'];
}

function smithsSections(m, saved) {
  const rows = m.ingredients.map(ing => {
    const key = KEYMAP[ing.item];
    const rec = key ? SMITHS.items[key] : null;
    return { ing, rec, area: smithsArea(rec) };
  });
  rows.sort((x, y) => x.area[0] - y.area[0]);
  let out = '', last = null, stop = 0;
  const dates = [];
  for (const { ing, rec, area } of rows) {
    if (area[1] !== last) { stop++; out += `<div class='stop-h'>Stop ${stop} · ${esc(area[1])}</div>`; last = area[1]; }
    if (rec && rec.available && rec.aisle) {
      const spot = [rec.aisle, rec.side ? rec.side + ' side' : null, rec.bay ? 'bay ' + rec.bay : null]
        .filter(Boolean).join(' · ') + (rec.note ? ' — ' + rec.note : '');
      const img = rec.img_local ? rec.img_local : rec.img;
      out += itemCard(ing.item, rec.title, spot, ing.qty, img, saved);
      if (rec.verified_at) dates.push(rec.verified_at);
    } else if (rec && rec.available === false) {
      out += itemCard(ing.item, ing.item, "Couldn't find this at Smiths — text Claude for a substitute", ing.qty, null, saved, true);
    } else {
      out += itemCard(ing.item, ing.item, 'Aisle not mapped yet — text Claude to verify this meal', ing.qty, null, saved, true);
    }
  }
  const oldest = dates.length ? dates.sort()[0] : null;
  const days = oldest ? Math.round((Date.now() - new Date(oldest)) / 864e5) : null;
  const stale = days !== null && days > 14;
  const banner = oldest
    ? `<div class='fresh ${stale ? 'stale' : ''}'>${stale ? '⚠️' : '✅'} Aisles last verified <b>${oldest}</b>${stale ? ' — locations may have moved.' : '.'}
       Stock and aisles change — to re-check right now, text Claude: <b>“verify ${esc(m.name)} at Smiths”</b>.</div>`
    : `<div class='fresh stale'>⚠️ No aisle data yet for this meal — text Claude: <b>“verify ${esc(m.name)} at Smiths”</b>.</div>`;
  return banner + out;
}

function deliverySections(m) {
  const lis = m.ingredients.map(i =>
    `<li>${esc(i.item)}<span class='qty'>${esc(i.qty)}</span></li>`).join('');
  return `<div class='dcta'>🛒 <b>How delivery works:</b> text Claude
      <b>“${esc(m.name)} — delivery”</b> and I'll fill your Amazon / Whole Foods cart
      and send you the checkout link. You just tap <b>Place Order</b>.<br>
      <span style='color:var(--muted)'>Heads up: Amazon delivery windows are usually 2+ hours
      out — good for planning ahead, not for hungry-right-now.</span></div>
    <div class='section'><h2>What goes in the cart</h2><ul class='shop'>${lis}</ul></div>`;
}

function renderPlan(id) {
  const m = MEALS.find(x => x.id === id);
  if (!m) { location.hash = ''; return; }
  const mode = getMode();
  const KEY = 'delish-' + id;
  const saved = new Set(JSON.parse(localStorage.getItem(KEY) || '[]'));
  const pills = [
    ['wf', '🏪 Whole Foods<br><small>store run</small>'],
    ['smiths', '🏪 Smiths<br><small>exact aisles</small>'],
    ['delivery', '🛒 Delivery<br><small>I fill your cart</small>'],
  ].map(([k, label]) =>
    `<div class='mode ${mode === k ? 'on' : ''}' onclick='setMode("${k}", "${id}")'>${label}</div>`).join('');
  const storeLine = mode === 'delivery' ? 'Whole Foods via Amazon — single store, no split orders' : STORES[mode];
  let body, hint;
  if (mode === 'smiths') { body = smithsSections(m, saved); hint = 'Tap items to check them off — frozen and hot items come last.'; }
  else if (mode === 'wf') { body = wfSections(m, saved); hint = 'Tap items to check them off — frozen and hot items come last so nothing thaws or cools.'; }
  else { body = deliverySections(m); hint = ''; }
  const steps = m.steps.map(s => `<li>${esc(s)}</li>`).join('');
  $('#root').innerHTML = `
    <a class='back' href='#'>‹ Back to options</a>
    <div class='storebar'><h1>${esc(m.name)}</h1>
      <div class='meta'>🏪 ${esc(storeLine)}</div>
      <div class='meta'>${m.protein_g}g protein · ~${m.calories} cal · ${m.active_minutes} min cook</div>
      <div class='modes'>${pills}</div>
      ${mode !== 'delivery' ? "<div class='progress'></div>" : ''}</div>
    ${hint ? `<p class='sub' style='margin-top:0'>${hint}</p>` : ''}
    ${body}
    <div class='section' style='margin-top:24px'><h2>When you're home: cook it (${m.active_minutes} min)</h2>
      <ol class='steps'>${steps}</ol></div>`;
  const items = document.querySelectorAll('.item');
  const refresh = () => {
    let done = 0;
    items.forEach(el => {
      const on = saved.has(el.dataset.key);
      el.classList.toggle('done', on);
      el.querySelector('.box').textContent = on ? '✓' : '';
      if (on) done++;
    });
    const p = $('.progress');
    if (p) p.textContent = done === items.length
      ? '✅ All ' + items.length + ' items — go check out!'
      : done + ' of ' + items.length + ' items';
  };
  items.forEach(el => el.addEventListener('click', () => {
    saved.has(el.dataset.key) ? saved.delete(el.dataset.key) : saved.add(el.dataset.key);
    localStorage.setItem(KEY, JSON.stringify([...saved]));
    refresh();
  }));
  refresh();
  window.scrollTo(0, 0);
}

function route() {
  const h = location.hash;
  if (h.startsWith('#m/')) {
    document.body.style.maxWidth = '560px';
    renderPlan(h.slice(3));
  } else {
    document.body.style.maxWidth = '1100px';
    deal.length ? renderList() : newDeal();
  }
}
window.addEventListener('hashchange', route);
route();
</script></body></html>
